name: fitforce_x
description: FitForce X — client mobile app (iOS + Android).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  # Deep links (workspace onboarding: fitforcex://w/<slug>)
  app_links: ^6.3.2

  # Exercise video: inline mp4 player (native) + open YouTube externally.
  # NB: we deliberately avoid webview-based YouTube players — flutter_inappwebview
  # ships a Gradle file incompatible with modern AGP (proguard-android.txt).
  video_player: ^2.9.2
  url_launcher: ^6.3.1

  # Realtime chat (pure Dart, no native) — falls back to polling
  socket_io_client: ^2.0.3

  # i18n
  intl: ^0.20.2

  # Models (immutable + JSON codegen)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── Added in later phases (kept here as a documented roadmap) ──
  # hive / hive_flutter                     # Phase 4 — session draft
  # fl_chart                                # Phase 4 — progress chart
  # youtube_player_flutter / video_player   # Phase 3 — exercise video
  # socket_io_client                        # Phase 6 — realtime chat
  # firebase_core / firebase_messaging      # Phase 7 — push

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Codegen for freezed/json models
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # Launcher icon + native splash generators (run once, see README)
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# Launcher icon: the blue brand mark on a white background.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

# Native splash: brand mark centered; light + dark backgrounds.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0B0D0F"
  image: assets/icon/app_icon.png
  android_12:
    image: assets/icon/app_icon.png
    color: "#FFFFFF"
    color_dark: "#0B0D0F"
  android: true
  ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
