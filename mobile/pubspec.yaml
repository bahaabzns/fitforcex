name: fitforce_x
description: FitForce — client mobile app (iOS + Android).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  # Deep links (workspace onboarding: fitforcex://w/<slug>)
  app_links: ^6.3.2

  # Exercise video: inline mp4 player (native) for uploaded videos, embedded
  # YouTube iframe player for youtube_url. youtube_player_iframe builds on
  # webview_flutter (the official Flutter-team package) — NOT
  # flutter_inappwebview, which is the one we avoid: its Gradle file is
  # incompatible with modern AGP (references a missing proguard-android.txt).
  video_player: ^2.9.2
  youtube_player_iframe: ^6.0.2
  url_launcher: ^6.3.1

  # Realtime chat (pure Dart, no native) — falls back to polling
  socket_io_client: ^2.0.3

  # Photo capture/pick — progress photos, form metric photos, chat image
  # attachments. Single shared picker, uploaded via multipart to the
  # existing /uploads/photo and /messages/attachments endpoints.
  image_picker: ^1.1.2

  # i18n
  intl: ^0.20.2

  # Models (immutable + JSON codegen)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  file_picker: ^11.0.2

  # ── Added in later phases (kept here as a documented roadmap) ──
  # hive / hive_flutter                     # Phase 4 — session draft
  # fl_chart                                # Phase 4 — progress chart
  # socket_io_client                        # Phase 6 — realtime chat
  # firebase_core / firebase_messaging      # Phase 7 — push

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Codegen for freezed/json models
  build_runner: ^2.9.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0

  # Launcher icon + native splash generators (run once, see README)
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# Launcher icon: the blue brand mark (client/public/blue_f_only.svg, the same
# artwork the web favicon/PWA icons use), on a white background. The adaptive
# (Android 8+) foreground is a separate, more generously padded rasterization
# of the same mark so it survives circle/squircle/rounded-square launcher
# masks without clipping — see mobile/assets/icon/README.md.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# Native splash: brand mark centered; light + dark backgrounds.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0B0D0F"
  image: assets/icon/app_icon.png
  android_12:
    image: assets/icon/app_icon.png
    color: "#FFFFFF"
    color_dark: "#0B0D0F"
  android: true
  ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
