# Drives `flutter gen-l10n`. Generated sources land in lib/l10n/generated/
# and are exposed as `AppLocalizations` (import package:fitforce_x/l10n/generated/app_localizations.dart).
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n/generated
synthetic-package: false
nullable-getter: false
