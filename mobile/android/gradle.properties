org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Djava.io.tmpdir=D:\\_tmp -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
kotlin.daemon.jvmargs=-Xmx512m
# Disable Kotlin incremental compilation: avoids "Could not close incremental
# caches (*.tab)" failures caused by Windows Defender locking the cache files.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 9 enables built-in Kotlin by default; this is the documented temporary
# opt-out (supported until AGP 10). Kept off because app_links's own
# build.gradle.kts has an AGP-version mismatch bug under built-in Kotlin;
# file_picker is pinned below its AGP-9-conditional release to match (see
# pubspec.yaml comment on file_picker).
android.builtInKotlin=false
